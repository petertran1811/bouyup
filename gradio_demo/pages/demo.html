<title>BuoyUp vòng vay</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: the 10 stages of the loan circle across the top; the borrower's phone on the left replays one case
   step by step; the control room on the right shows what the agents, the decision core and the banks did. */
:root{
 --bg:#f2f6f4; --surface:#fff; --soft:#eaf1ed; --ink:#102a28; --muted:#516a63; --dim:#6f837c; --line:#d7e3dd;
 --primary:#08766c; --primary-ink:#fff; --signal:#d5f06a; --signal-ink:#183a28;
 --ok:#13784a; --ok-bg:#e5f4ea; --warn:#85530a; --warn-bg:#fff2d3; --bad:#b42335; --bad-bg:#fbe9eb; --info:#275ca8; --info-bg:#eaf1fe;
 --s1:#08766c; --s2:#c2760c; --s3:#5a4fcf;
 --phone:#0d1f1c; --phone-screen:#f7faf8;
 --sans:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
 --r-sm:8px; --r:14px; --r-lg:22px; --shadow:0 1px 2px rgb(16 42 40/.05),0 10px 30px -18px rgb(16 42 40/.3);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#071513; --surface:#0d211e; --soft:#132b26; --ink:#e7f2ed; --muted:#a6bcb3; --dim:#8a9f97; --line:#26403a;
 --primary:#5ee3c1; --primary-ink:#06201a; --signal:#d9f572; --signal-ink:#183a28;
 --ok:#7cdeb1; --ok-bg:#11342a; --warn:#f5cb87; --warn-bg:#382a12; --bad:#ff9ea4; --bad-bg:#3a1a21; --info:#9dc5ff; --info-bg:#162a47;
 --s1:#5ee3c1; --s2:#f5b04e; --s3:#a99cff;
 --phone:#020807; --phone-screen:#0a1a17; --shadow:0 12px 32px -16px #000a; color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#071513; --surface:#0d211e; --soft:#132b26; --ink:#e7f2ed; --muted:#a6bcb3; --dim:#8a9f97; --line:#26403a;
 --primary:#5ee3c1; --primary-ink:#06201a; --signal:#d9f572; --signal-ink:#183a28;
 --ok:#7cdeb1; --ok-bg:#11342a; --warn:#f5cb87; --warn-bg:#382a12; --bad:#ff9ea4; --bad-bg:#3a1a21; --info:#9dc5ff; --info-bg:#162a47;
 --s1:#5ee3c1; --s2:#f5b04e; --s3:#a99cff;
 --phone:#020807; --phone-screen:#0a1a17; --shadow:0 12px 32px -16px #000a; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
.block>.chip,.result>.chip{justify-self:start}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);padding-inline:16px;padding-block:20px 48px;overflow-x:hidden}
.wrap{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;min-width:0}
#scenario{min-width:0;max-width:100%;text-overflow:ellipsis}
h1,h2,h3{text-wrap:balance;margin:0}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.mono{font-family:var(--mono);font-size:.82em}
.num{font-variant-numeric:tabular-nums lining-nums}
.muted{color:var(--muted)} .dim{color:var(--dim)}
.top{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between}
.brand{display:flex;gap:12px;align-items:center}
.mark{width:40px;height:40px;border-radius:12px;background:var(--primary);display:grid;place-items:center;color:var(--primary-ink);font-weight:700;font-size:18px;flex:none}
.brand h1{font-size:1.45rem;letter-spacing:-.02em}
.brand p{margin:0;color:var(--muted);font-size:.9rem}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-width:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:3px}
.seg button{border:0;background:none;border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.86rem;color:var(--muted)}
.seg button.on{background:var(--primary);color:var(--primary-ink);font-weight:600}
.select{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px;max-width:100%;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--primary)}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:var(--primary);font-weight:600}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{padding:4px 10px;font-size:.8rem}
.note{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;font-size:.88rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 18px}
.note b{color:var(--ink);font-weight:600}
/* the 10 stages */
.stages{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px;min-width:0}
@media (max-width:1100px){.stages{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media (max-width:560px){.stages{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stg{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:7px 9px;text-align:left;cursor:pointer;display:grid;gap:2px;min-width:0}
.stg .n{font-size:.68rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;gap:6px;align-items:center}
.stg .t{font-size:.8rem;font-weight:600;line-height:1.25}
.stg .s{font-size:.7rem;color:var(--dim)}
.stg.done{border-color:color-mix(in srgb,var(--primary) 55%,var(--line))}
.stg.done .n{color:var(--primary)}
.stg.cur{background:var(--signal);color:var(--signal-ink);border-color:transparent}
.stg.cur .n,.stg.cur .s{color:var(--signal-ink)}
.stg.off{opacity:.5;cursor:default}
.stg.stop{border-style:dashed}
/* stage */
.stage{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:940px){.stage{grid-template-columns:minmax(0,1fr)}}
.left{display:grid;gap:14px;justify-items:center;position:sticky;top:12px;min-width:0}
@media (max-width:940px){.left{position:static}}
.phone{width:100%;max-width:360px;background:var(--phone);border-radius:44px;padding:12px;box-shadow:var(--shadow)}
.screen{background:var(--phone-screen);border-radius:34px;height:680px;display:flex;flex-direction:column;overflow:hidden}
@media (max-width:420px){.phone{border-radius:30px;padding:8px}.screen{border-radius:24px;height:600px}}
.sbar{display:flex;justify-content:space-between;padding:12px 24px 4px;font-size:.78rem;font-weight:600}
.appbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 18px 10px;border-bottom:1px solid var(--line)}
.appbar b{font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.appbar .mono{color:var(--dim);white-space:nowrap}
.pbody{flex:1;overflow-y:auto;padding:14px 16px 18px;display:grid;gap:12px;align-content:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.card h3{font-size:.95rem;margin-bottom:6px}
.kv{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:4px 12px;font-size:.85rem;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;overflow-wrap:break-word}
.big{font-size:2.1rem;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.big small{font-size:.9rem;font-weight:500;color:var(--muted);margin-left:4px}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 9px;font-size:.75rem;font-weight:600;white-space:nowrap}
.c-ok{background:var(--ok-bg);color:var(--ok)} .c-warn{background:var(--warn-bg);color:var(--warn)}
.c-bad{background:var(--bad-bg);color:var(--bad)} .c-info{background:var(--info-bg);color:var(--info)}
.c-mute{background:var(--soft);color:var(--muted)} .c-sig{background:var(--signal);color:var(--signal-ink)}
.list{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;font-size:.85rem;align-items:start}
.dot{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:.65rem;font-weight:700;margin-top:2px}
.bubble{border-radius:16px;padding:8px 12px;font-size:.86rem;max-width:88%}
.me{background:var(--primary);color:var(--primary-ink);justify-self:end;border-bottom-right-radius:4px}
.bot{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.qchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:.78rem;cursor:pointer;text-align:left}
.qchip:hover{border-color:var(--primary)}
.qchip.on{background:var(--signal);color:var(--signal-ink);border-color:transparent;font-weight:600}
.box{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;font-size:.84rem;padding:8px 0;border-top:1px solid var(--line)}
.box:first-of-type{border-top:0}
.tick{width:20px;height:20px;border-radius:5px;border:2px solid var(--primary);display:grid;place-items:center;font-size:.75rem;font-weight:700;color:var(--primary-ink);background:var(--primary)}
.tick.no{background:transparent;color:transparent}
.result{border-radius:var(--r);padding:14px;display:grid;gap:6px}
.r-ok{background:var(--ok-bg)} .r-warn{background:var(--warn-bg)} .r-bad{background:var(--bad-bg)} .r-info{background:var(--info-bg)}
.result h2{font-size:1.2rem}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--primary)}
.split{display:flex;height:22px;border-radius:8px;overflow:hidden;font-size:.7rem;font-weight:600}
.split span{display:grid;place-items:center;color:#fff;min-width:0;overflow:hidden;white-space:nowrap}
.wait{display:grid;place-items:center;gap:10px;text-align:center;padding:18px 8px}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--soft);border-top-color:var(--primary)}
@media (prefers-reduced-motion:no-preference){.spin{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}}
/* stepper */
.stepper{width:100%;max-width:360px;display:grid;gap:10px}
.nav{display:flex;gap:6px;justify-content:space-between}
.steps{display:flex;flex-wrap:wrap;gap:5px}
.sdot{border:1px solid var(--line);background:var(--surface);border-radius:999px;font-size:.72rem;padding:3px 9px;cursor:pointer}
.sdot.done{border-color:var(--primary);color:var(--primary)}
.sdot.cur{background:var(--signal);color:var(--signal-ink);border-color:transparent;font-weight:700}
.steplabel{font-weight:600;font-size:.95rem}
/* control room */
.room{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;min-width:0}
.tabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--line);background:var(--soft)}
.tab{border:0;background:none;padding:12px 14px;cursor:pointer;white-space:nowrap;font-size:.86rem;color:var(--muted);border-bottom:2px solid transparent;display:flex;gap:6px;align-items:center}
.tab.on{color:var(--ink);border-bottom-color:var(--primary);font-weight:600;background:var(--surface)}
.tab .pip{width:7px;height:7px;border-radius:50%;background:var(--line)}
.tab.live .pip{background:var(--signal);box-shadow:0 0 0 3px color-mix(in srgb,var(--signal) 40%,transparent)}
.tab.has .pip{background:var(--primary)}
.panel{padding:18px 20px 24px;display:grid;gap:16px;min-width:0}
@media (max-width:560px){.panel{padding:14px 12px 18px}}
.panel h2{font-size:1.15rem}
.lead{color:var(--muted);font-size:.9rem;max-width:72ch;margin:0}
.sec{display:grid;gap:8px;min-width:0}
.sec>h3{font-size:.8rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-sm);min-width:0}
table{border-collapse:collapse;width:100%;font-size:.84rem}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--soft);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.hl td{background:color-mix(in srgb,var(--signal) 28%,transparent)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:12px}
.block{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:6px;min-width:0}
.block header{display:flex;gap:8px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.block .code{font-family:var(--mono);font-weight:500;color:var(--primary)}
.formula{font-family:var(--mono);font-size:.76rem;background:var(--soft);border-radius:6px;padding:6px 8px;overflow-x:auto;white-space:pre-wrap;word-break:break-word}
.quote{font-size:.92rem;border-left:3px solid var(--signal);padding:2px 0 2px 10px}
.hash{font-family:var(--mono);font-size:.74rem;color:var(--muted);word-break:break-all}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted)}
details{border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 12px;min-width:0}
details summary{cursor:pointer;font-size:.86rem;font-weight:600}
pre{margin:6px 0 0;font-family:var(--mono);font-size:.72rem;white-space:pre-wrap;word-break:break-word;color:var(--muted)}
.cond{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;font-size:.86rem;align-items:start}
.foot{font-size:.8rem;color:var(--dim)}
/* bank round */
.race{display:grid;gap:8px}
.lane{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr);gap:10px;align-items:center;font-size:.82rem}
@media (max-width:560px){.lane{grid-template-columns:minmax(0,1fr)}}
.track{position:relative;height:24px;background:var(--soft);border-radius:6px;overflow:hidden}
.fill{position:absolute;inset:0 auto 0 0;width:0;border-radius:6px;background:color-mix(in srgb,var(--info) 35%,transparent)}
.fill.approve{background:color-mix(in srgb,var(--ok) 45%,transparent)}
.fill.decline,.fill.timeout{background:color-mix(in srgb,var(--bad) 40%,transparent)}
.fill.not_sent{background:repeating-linear-gradient(45deg,var(--line) 0 6px,transparent 6px 12px)}
.tlabel{position:absolute;left:8px;top:2px;font-size:.74rem;font-weight:600;white-space:nowrap}
.limit30{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--bad)}
.axis{display:flex;justify-content:space-between;font-size:.68rem;color:var(--dim);font-family:var(--mono)}
.clock{font-family:var(--mono);font-size:1.6rem;font-weight:600}
/* chart */
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
/* form */
.formcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;display:grid;gap:12px;min-width:0}
@media (max-width:560px){.formcard{padding:12px}}
.formcard>header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.formcard h2{font-size:1.1rem}
.fsec{border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.fsec>summary{cursor:pointer;font-weight:600;font-size:.92rem}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(200px,100%),1fr));gap:10px 16px;margin-top:10px}
.ffield{display:grid;gap:4px;font-size:.8rem;color:var(--muted);min-width:0}
.ffield .select,.finput{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 10px;font-size:.9rem;color:var(--ink);min-width:0}
.fchk{display:flex;gap:8px;align-items:center;font-size:.84rem}
.fchk input{accent-color:var(--primary);width:16px;height:16px}
@media (prefers-reduced-motion:no-preference){.pbody>*,.panel>*{animation:rise .35s cubic-bezier(.22,1,.36,1) both}
 @keyframes rise{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}}
/* phone app for "Tự điền" */
.pnav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:var(--soft);border-radius:12px;padding:3px}
.pnav button{border:0;background:none;border-radius:9px;padding:6px 2px;font-size:.72rem;color:var(--muted);cursor:pointer;white-space:nowrap}
.pnav button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgb(0 0 0/.08)}
.pform{display:grid;gap:10px}
.pfield{display:grid;grid-template-columns:minmax(0,1fr) 112px;gap:8px;align-items:center;font-size:.8rem;color:var(--muted)}
.pfield input,.pfield select{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:6px 8px;font-size:.88rem;color:var(--ink);text-align:right}
.pfield select{text-align:left}
.pchk{display:flex;gap:8px;align-items:center;font-size:.8rem;color:var(--muted)}
.pchk input{accent-color:var(--primary);width:16px;height:16px}
.pchips{display:flex;flex-wrap:wrap;gap:6px}
.pstrip{position:sticky;bottom:-18px;display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:.86rem;box-shadow:var(--shadow)}
#f_amount{width:100%;accent-color:var(--primary)}
.card details>summary,details.card>summary{cursor:pointer;font-weight:600;font-size:.86rem}
details.card .pform{margin-top:10px}
.stg .s{display:none}
.grid2{align-items:start}
.pbody p.dim{display:none}
/* custom flow on the phone */
.ptop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.purl{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 10px;font-size:.84rem;color:var(--ink)}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:16px 8px;display:grid;gap:6px;justify-items:center;font:inherit;font-size:.84rem;cursor:pointer;color:var(--ink)}
.tile span{font-size:1.4rem;color:var(--muted)}
.tile.on{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 10%,var(--surface))}
.tile.on span{color:var(--primary)}
label.box{cursor:pointer}
/* the agents' room is hidden until asked for */
body.room-off .room{display:none}
body.room-off .stage{grid-template-columns:minmax(0,1fr);justify-items:center}
body.room-off .left{position:static;width:100%;max-width:420px}
#roomToggle[aria-expanded="true"]{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
</style>

<div class="wrap">
 <header class="top">
  <div class="brand"><div class="mark" aria-hidden="true">B</div>
   <div><h1>BuoyUp · vòng vay</h1><p>Một khoản vay qua 10 giai đoạn</p></div></div>
  <div class="controls">
   <div class="seg" role="group" aria-label="Chế độ"><button type="button" id="mReplay" class="on">Kịch bản có sẵn</button><button type="button" id="mCustom">Tự điền</button></div>
   <select id="scenario" class="select" aria-label="Kịch bản"></select>
   <button class="btn" id="roomToggle" type="button" aria-controls="room" aria-expanded="false">Xem các agent làm gì</button>
   <button class="btn" id="theme" type="button">Đổi nền sáng tối</button>
  </div>
 </header>
 <div class="note" id="note"></div>
 <nav class="stages" id="stages" aria-label="Mười giai đoạn"></nav>
 <section class="formcard" id="form" hidden aria-label="Tự điền hồ sơ">
  <header><div><h2>Tự điền hồ sơ</h2><p class="lead">Điền sẵn số liệu chị Lan. Đổi ô nào, hạn mức, vòng duyệt của các ngân hàng và lịch trả tính lại ngay, bằng bản chuyển của lõi quyết định và quy tắc ngân hàng chạy trong trình duyệt.</p></div>
  <button class="btn" id="resetForm" type="button">Về số liệu chị Lan</button></header>
  <div id="formBody"></div>
 </section>
 <main class="stage">
  <div class="left">
   <div class="phone" aria-label="Màn hình người vay">
    <div class="screen">

<script>
/* BuoyUp loan-circle decision core in the browser: a line-by-line port of app/core/algorithm.py (B1, B3–B9,

   retries at 70 % and 50 %). Python's round() is round-half-even on the exact double: pyRound reproduces it.
   Checked against the Python code on random inputs (parity test). */
const LCE = (() => {
const GRADES = ['A', 'B', 'C', 'D', 'E'];
const BANDS = {rating: [[4.7, 10], [4.4, 8], [4.0, 5], [-Infinity, 0]], age_m: [[36, 10], [24, 8], [12, 5], [-Infinity, 0]],
  gross_margin: [[0.35, 10], [0.20, 7], [0.10, 4], [-Infinity, 0]], monthly_avg: [[500000, 5], [150000, 4], [50000, 2], [-Infinity, 0]]};
const OPTION_LABELS = {full: 'Hạn mức đầy đủ', step70: 'Phương án 70%', step50: 'Phương án 50%'};
const METHODS = ['installment', 'revenue'];
const METHOD_LABELS = {installment: 'Trả góp cố định theo tháng', revenue: 'Trả theo doanh thu'};

function pyRound(x) { // Python 3 round(x): ties to even, on the exact binary value
  const f = Math.floor(x), d = x - f;
  if (d > 0.5) return f + 1;

}

}
function exactDecimal(x) { // exact decimal string of a double (finite)
  if (x === 0) return '0';
  const neg = x < 0; x = Math.abs(x);
  const buf = new DataView(new ArrayBuffer(8)); buf.setFloat64(0, x);
  const hi = buf.getUint32(0), lo = buf.getUint32(4);

    let digits = '';

  let [ip, fp = ''] = s.split('.');
  const keep = fp.slice(0, n).padEnd(n, '0'), rest = fp.slice(n);
  let big = BigInt(ip + keep);
  if (rest.length) {
    const first = rest[0], tail = rest.slice(1).replace(/0+$/, '');
    if (first > '5' || (first === '5' && tail.length)) big += 1n;

const floorTo = (v, step) => Math.floor(v / step + 1e-9) * step;
const floorPct = x => Math.floor(x * 100 + 1e-9) / 100;
const ceilPct = x => Math.ceil(x * 100 - 1e-9) / 100;

/* dates as 'YYYY-MM-DD' strings, computed in UTC */
const D = s => { const [y, m, d] = s.split('-').map(Number); return {y, m, d}; };

const leap = y => y % 4 === 0 && (y % 100 !== 0 || y % 400 === 0);

  const t = dt.m - 1 + months; const y = dt.y + Math.floor(t / 12), m = ((t % 12) + 12) % 12 + 1;
  return {y, m, d: Math.min(dt.d, dim(y, m))};

const dayNum = dt => Date.UTC(dt.y, dt.m - 1, dt.d) / 86400000;
const daysBetween = (a, b) => dayNum(b) - dayNum(a);

  return String(n).replace('.', ',');
}

/* B1 */
function customerGroup(c) {
  if ((c.late_max_days_24m || 0) >= 30 || c.defaulted_within_24m || c.active_npl || c.network_history === 'bad') return 4;
  if (c.network_history === 'good') return 1;
  if (c.has_credit_elsewhere) return 2;
  return 3;
}
/* B3 */
function capitalNeed(P, plan, invoicePrice, supplier) {
  const declared = plan.price, gap = invoicePrice == null;
  const ref = gap ? declared * (1 - P.price.no_invoice_haircut) : invoicePrice;
  const priceUsed = Math.min(declared, ref);
  const factor = supplier.linked ? 0.0 : (!supplier.invoice_history ? P.price.new_supplier_factor : 1.0);
  const planValue = pyRound(plan.qty * priceUsed * factor);
  const deductions = plan.inventory + plan.own_capital + (plan.other_loans || 0);
  return {price_declared: declared, unit_price_used: priceUsed, supplier_factor: factor, plan_value: planValue,
    need: Math.max(0, planValue - deductions), requested: pyRound(plan.qty * declared), data_source_gap: gap};
}
/* B4, B5 */
function prudentRevenue(P, revenue, industry, statementsVerified) {
  const growth = Math.min(revenue.growth_3m, P.forecast.growth_cap);
  const forecast = pyRound(revenue.monthly_avg_12m * (1 + growth));
  let prudence = P.prudence[industry] ?? P.prudence['khác'];
  if (statementsVerified) prudence = pyRoundN(prudence + P.revenue.statement_bonus, 4);
  return {growth_used: growth, forecast, prudence, prudent: pyRound(forecast * prudence)};
}
function sweepCap(gm, fee) { const cap = (1 - gm) / (1 - fee); return {sweep_cap: pyRoundN(cap, 4), sweep_usable: floorPct(cap)}; }
/* B6, B7 */
const band = (name, v) => BANDS[name].find(([lo]) => v >= lo)[1];
function scorecard(P, {credit, fate, rating, age_m, cv, gross_margin, monthly_avg}) {
  const late = credit.late_max_days_24m || 0, inq = credit.inquiries_3m || 0, debt = credit.debt_to_inflow || 0;
  return {late: late === 0 ? 20 : (late < 30 ? 10 : 0), inquiries: inq <= 1 ? 10 : (inq <= 3 ? 6 : (inq <= 5 ? 3 : 0)),
    debt: debt < 0.10 ? 10 : (debt < 0.30 ? 6 : (debt < 0.60 ? 3 : 0)), fate: Math.trunc(P.scorecard.fate_points[String(fate)]),
    rating: band('rating', rating), age: band('age_m', age_m), volatility: cv < 0.25 ? 10 : (cv < 0.5 ? 7 : (cv < 0.8 ? 3 : 0)),
    gross_margin: band('gross_margin', gross_margin), monthly_avg: band('monthly_avg', monthly_avg)};
}
function gradeOf(P, s) { for (const g of ['A', 'B', 'C', 'D']) if (s >= P.scorecard.grades[g]) return g; return 'E'; }
const applyPenalties = (g, n, hardE) => hardE ? 'E' : GRADES[Math.min(GRADES.length - 1, GRADES.indexOf(g) + n)];
function rateFloor(P, amount, tenor, cost) {
  const avg = amount * Number(P.rates.avg_balance_share);
  if (avg <= 0 || tenor <= 0) return cost;
  return pyRoundN(cost + Number(P.rates.processing_cost) / (avg * tenor / 12), 4);
}
/* B9 */
const tenorsFor = (P, bt) => [...(P.product.tenors[bt] || P.product.tenors.individual_business)];
function firstDueDate(P, start, dueDay) {
  let first = addMonths({y: start.y, m: start.m, d: 1}, 1); first = {...first, d: Math.min(dueDay, 28)};
  if (daysBetween(start, first) < Math.trunc(P.product.first_due_min_days)) first = addMonths(first, 1);
  return first;
}
function dueDates(P, start, dueDay, tenor) { const f = firstDueDate(P, start, dueDay); return Array.from({length: tenor}, (_, k) => addMonths(f, k)); }
const interestFor = (out, rate, days) => pyRound(out * rate * days / 365);
const minPayment = (P, amount, tenor, interest) => interest + Math.ceil(P.repay.min_principal_share * amount / tenor);
function revenueRate(P, amount, rate, tenor, prudent, usable) {
  const total = amount + pyRound(amount * rate * tenor / 12);
  const need = prudent > 0 ? ceilPct(total / (prudent * tenor)) : usable;
  return Math.min(need, usable);
}
function schedule(P, {amount, rate, tenor_m, method, start, due_day, prudent = 0, sweep_usable = 0}) {
  const st = typeof start === 'string' ? D(start) : start;
  const dates = dueDates(P, st, due_day, tenor_m);
  const rows = []; let out = amount, prev = st;
  const base = Math.floor(amount / tenor_m);
  const rr = method === 'revenue' ? revenueRate(P, amount, rate, tenor_m, prudent, sweep_usable) : null;
  for (let i = 0; i < dates.length; i++) {
    const k = i + 1, d = dates[i], days = daysBetween(prev, d), interest = interestFor(out, rate, days), last = k === tenor_m;
    let principal;
    if (method === 'installment') principal = last ? out : Math.min(out, base);
    else { const minimum = minPayment(P, amount, tenor_m, interest); const pay = Math.max(minimum, pyRound((rr || 0) * prudent));
      principal = last ? out : Math.min(out, Math.max(0, pay - interest)); }
    rows.push({k, due_date: iso(d), days, principal, interest, payment: principal + interest, outstanding_after: out - principal});
    out -= principal; prev = d;
    if (out <= 0) break;
  }

  return {amount, rate, apr: rate, tenor_m, method, method_label: METHOD_LABELS[method], due_day, revenue_rate: rr,
    first_due_date: rows.length ? rows[0].due_date : null, final_due_date: iso(dates[dates.length - 1]), rows,
    total_interest: totalInterest, total_due: amount + totalInterest, fees: 0,
    first_payment: rows.length ? rows[0].payment : 0,
    min_payment_first: rows.length ? minPayment(P, amount, tenor_m, rows[0].interest) : 0};
}
/* B8 */
function limitCaps(P, {prudent, sweep_usable, rate, tenor_max, monthly_avg, group, borrower_type}) {
  const p = P.product;
  const affordability = prudent * tenor_max * sweep_usable / (1 + rate * tenor_max / 12);
  const group_cap = pyRound(p.group_cap_mult[String(group)] * monthly_avg);
  const type_cap = Math.trunc(p.type_cap[borrower_type] ?? p.type_cap.company);
  const caps = {affordability, group_cap, type_cap};
  let binding = 'affordability';
  for (const k of ['group_cap', 'type_cap']) if (caps[k] < caps[binding]) binding = k;
  return {caps, binding, limit: floorTo(Math.max(0, caps[binding]), 100)};
}
function option(id, amount, {rate, tenor_m}) {
  const est = pyRound(amount * rate * (tenor_m + 1) / 24);
  return {id, amount, rate, tenor_m, max_interest: est, total_due: amount + est,
    monthly_principal: tenor_m ? Math.floor(amount / tenor_m) : amount, label: OPTION_LABELS[id] || 'Mức người vay chọn'};
}
function reasonCodes(b3, limit, binding, requested, need) {
  const out = [];
  if (b3) {
    const priceCut = pyRound(b3.qty * (b3.price_declared - b3.unit_price_used));
    if (priceCut > 0) out.push({code: 'PRICE_FROM_INVOICE', impact: -priceCut, block: 'B3',
      text: `Giá nhập tính theo hóa đơn ${fmtNum(b3.unit_price_used)} tệ thay vì ${fmtNum(b3.price_declared)} tệ`});
    const supplierCut = pyRound(b3.qty * b3.unit_price_used) - b3.plan_value;
    if (supplierCut > 0) out.push({code: 'SUPPLIER_FACTOR', impact: -supplierCut, block: 'B3',
      text: 'Phần hàng của nhà cung cấp chưa có hóa đơn với chị được tính giảm'});
    if (b3.deductions > 0) out.push({code: 'INVENTORY_AND_OWN_CAPITAL', impact: -b3.deductions, block: 'B3',
      text: 'Trừ tồn kho, vốn tự có và khoản vay khác cho kế hoạch'});
  }
  const texts = {affordability: 'Khả năng trả từ doanh thu dự báo thận trọng trong kỳ hạn dài nhất',
    group_cap: 'Trần theo nhóm khách hàng', type_cap: 'Trần của hộ kinh doanh vay trực tuyến'};
  const base = need != null ? need : requested;

   `<div class="tbl"><table><tbody>${[['POL-02', s.group !== 4, 'Nhóm 4 không được cấp hạn mức'], ['RISK-03', s.grade !== 'E', 'Hạng E từ chối'], ['B7', !r.floorViolation, 'Lãi theo hạng ≥ sàn chi phí vốn'], ...(r.rules || []).map(x => [x[0], false, x[2]])].map(([c, ok, t]) => `<tr class="${ok ? '' : 'hl'}"><td class="mono">${esc(c)}</td><td>${esc(t)}</td><td>${ok ? chip('đạt', 'c-ok') : chip('bật', 'c-bad')}</td></tr>`).join('')}</tbody></table></div>`;
 }
 if (tab === 'banks') {
  if (!r.syn) return `<div class="empty">Hồ sơ dừng trước vòng duyệt của các ngân hàng.</div>`;
  const save = S.sc; S.sc = {syndicate: {...r.syn, expires_at: null, id: 'mô phỏng', hash: null}, decision_final: null};
  let h = pBanks(); S.sc = save;
  return h.replace('Mã vòng duyệt', 'Vòng duyệt').replace('Hiệu lực tới', 'Hiệu lực');
 }
 if (tab === 'sched') {
  if (!r.sched) return `<div class="empty">Chưa có hạn mức nên chưa có lịch trả.</div>`;
  const conv = sc => sc.rows.map(x => [x.k, x.due_date, x.days, x.principal, x.interest, x.payment, x.outstanding_after]);
  return head('Lịch trả hai cách', `Số tiền ${money(r.amount)}, ${r.tenor} tháng, ngày trả ${r.dueDay}, giải ngân ${fmtDate(r.start)}. Lãi theo ngày thực tế trên dư nợ gốc; cách trả theo doanh thu dùng doanh thu thận trọng ${money(s.prudent)}/tháng làm dự báo.`) +
   `<div class="grid2">${['installment', 'revenue'].map(m => `<div class="block"><span class="eyebrow">${esc(methodTxt[m])}</span>${kv([['Kỳ đầu', money(r.sched[m].first_payment)], ['Tối thiểu kỳ đầu', money(r.sched[m].min_payment_first)], ['Tổng lãi', money(r.sched[m].total_interest)], ['Tổng phải trả', money(r.sched[m].total_due)], m === 'revenue' ? ['Tỷ lệ doanh thu', pct(r.sched[m].revenue_rate)] : null])}</div>`).join('')}</div>` +
   sec('Trả góp cố định', schedTable(conv(r.sched.installment))) + sec('Trả theo doanh thu', schedTable(conv(r.sched.revenue))) +
   sec('Chia giải ngân cho các ngân hàng (phần dư lớn nhất)', kv(r.syn.split.map((x, i) => [x.name, money(r.legs[i])])));
 }
 return '';
}
function customRoom(r) {
 const live = r.syn ? 'banks' : 'core';
 if (!CTABS.some(t => t[0] === S.tab)) S.tab = 'core';
 $('tabs').innerHTML = CTABS.map(([k, t]) => `<button role="tab" class="tab ${S.tab === k ? 'on' : ''} ${k === live ? 'live' : ''} has" data-tab="${k}" aria-selected="${S.tab === k}" type="button"><span class="pip"></span>${esc(t)}</button>`).join('');
 document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { S.tab = b.dataset.tab; customRoom(S.result); });
 $('panel').innerHTML = customPanel(r, S.tab);
 if (S.tab === 'banks' && r.syn) { S.raceKey = 'c:' + S.i; startRace(); }
 $('stepLabel').textContent = 'Kết quả: ' + ({offered: 'hạn mức ' + money(r.limit) + ' tệ', rejected: 'từ chối', no_partner: 'không ngân hàng nào nhận', out_of_scope: 'ngoài phạm vi'}[r.state]);
 stageBar();
}
function renderCustom() {
 const r = runCustom(S.I); S.result = r;
 const y = $('phone').scrollTop; customPhone(r); $('phone').scrollTop = y;
 customRoom(r);
}
function loadCustom() {
 stopTimer();
 S = {...S, mode: 'custom', sc: null, steps: [], i: 0, tab: 'core', I: JSON.parse(JSON.stringify(LAN_INPUT)), raceKey: '', cpage: 'link',
  C: {url: D.scenarios[0].url, read: null, cccd: false, face: false, boxes: {}, sign: 'face', readLeft: P.contract.read_seconds || 20, acct: '', supAcct: '', commit: false, guarantee: false, readAck: false}};
 if (S.ctimer) { clearInterval(S.ctimer); S.ctimer = null; }
 $('form').hidden = true; $('stepNav').hidden = true; $('scenario').hidden = true;
 $('mReplay').classList.remove('on'); $('mCustom').classList.add('on');
 $('note').innerHTML = `<span><b>Tự điền</b></span><span>Làm hồ sơ từ đầu trên điện thoại: dán link, định danh, đồng ý, sửa số liệu, chọn vay, ký.</span><span class="dim">Mô phỏng</span>`;
 renderCustom();
}

/* ---------------- wiring ---------------- */
$('scenario').innerHTML = D.scenarios.map(s => `<option value="${esc(s.key)}">${esc(s.label)}</option>`).join('');
$('scenario').onchange = e => load(e.target.value);
$('prev').onclick = () => go(S.i - 1);
$('next').onclick = () => go(S.i + 1);
$('reset').onclick = () => go(0);
$('mReplay').onclick = () => load($('scenario').value);
$('mCustom').onclick = () => loadCustom();
$('resetForm').onclick = () => loadCustom();
$('theme').onclick = () => { const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark ? 'light' : 'dark'; };
document.addEventListener('keydown', e => { if (S.mode !== 'replay' || /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return; if (e.key === 'ArrowRight') go(S.i + 1); if (e.key === 'ArrowLeft') go(S.i - 1); });
$('foot').textContent = `Ghi từ backend thật ngày ${fmtDate(D.generated)} · số liệu mô phỏng`;
function setRoom(open) {
 document.body.classList.toggle('room-off', !open);
 const b = $('roomToggle'); b.setAttribute('aria-expanded', String(open)); b.textContent = open ? 'Ẩn phần giải thích' : 'Xem các agent làm gì';
 try { localStorage.setItem('bu_room', open ? '1' : '0'); } catch (e) { /* per-viewer convenience only */ }
}
$('roomToggle').onclick = () => setRoom(document.body.classList.contains('room-off'));
let roomOpen = false;
try { roomOpen = localStorage.getItem('bu_room') === '1'; } catch (e) { /* default: hidden */ }
setRoom(roomOpen);
load(D.scenarios[0].key);

</script>
