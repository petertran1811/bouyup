[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning
markers =
    seed_loan: run with the real seed-loan ratio (first loan 50%)
    product_v5: run with the 17/10/2026 product (system tenor, instalments only, all to the WeBank account)
