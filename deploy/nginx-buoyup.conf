# Nginx đứng trước BuoyUp (HTTPS). Đặt vào /etc/nginx/sites-available/buoyup rồi ln -s sang sites-enabled.
# Đổi buoyup.example.com thành tên miền của bạn; chứng chỉ: sudo certbot --nginx -d buoyup.example.com
server {
    listen 80;
    server_name buoyup.example.com;

    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # trợ lý chat chờ mô hình: cho phép trả lời chậm
        proxy_read_timeout 120s;
    }
}
